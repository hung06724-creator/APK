services:
  - type: web
    name: kho-vat-tu
    runtime: node
    rootDir: kho-vat-tu
    plan: free
    buildCommand: npm install && (command -v python3 >/dev/null && pip3 install --user -r scripts/requirements-theo-doi.txt || true)
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
